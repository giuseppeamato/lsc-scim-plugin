name: Java CI with JaCoCo, SonarCloud, and Codecov

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: maven

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Download certificate
      run: wget https://github.com/giuseppeamato/lsc-scim-plugin/releases/download/v1.1.2/wso2ids.crt

    - name: Import certificate to Java keystore
      run: sudo keytool -importcert -trustcacerts -noprompt -alias wso2ids -file wso2ids.crt -storepass changeit -keystore $JAVA_HOME/lib/security/cacerts

    - name: Configure Maven settings.xml
      run: |
        mkdir -p $HOME/.m2
        cat > $HOME/.m2/settings.xml <<'EOL'
<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
          xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                              https://maven.apache.org/xsd/settings-1.0.0.xsd">

  <profiles>
    <profile>
      <id>default-profile</id>
      <repositories>
        <repository>
          <id>central</id>
          <url>https://repo.maven.apache.org/maven2</url>
          <releases><enabled>true</enabled></releases>
          <snapshots><enabled>false</enabled></snapshots>
        </repository>
        <repository>
          <id>lsc-site</id>
          <url>https://lsc-project.org/maven</url>
          <releases><enabled>true</enabled></releases>
          <snapshots><enabled>true</enabled></snapshots>
        </repository>
        <repository>
          <id>forgerock-community-repository</id>
          <url>https://maven.forgerock.org/artifactory/community</url>
          <releases><enabled>true</enabled></releases>
          <snapshots><enabled>true</enabled></snapshots>
        </repository>
      </repositories>
    </profile>
  </profiles>

  <activeProfiles>
    <activeProfile>default-profile</activeProfile>
  </activeProfiles>

  <mirrors>
    <mirror>
      <id>lsc-site-http</id>
      <mirrorOf>lsc-site</mirrorOf>
      <url>http://lsc-project.org/maven</url>
      <blocked>false</blocked>
    </mirror>
    <mirror>
      <id>java-net-http</id>
      <mirrorOf>java.net Maven 2</mirrorOf>
      <url>http://download.java.net/maven/2</url>
      <blocked>false</blocked>
    </mirror>
    <mirror>
      <id>forgerock-http</id>
      <mirrorOf>forgerock-community-repository</mirrorOf>
      <url>http://maven.forgerock.org/repo/community</url>
      <blocked>false</blocked>
    </mirror>
    <mirror>
      <id>burtsev-http</id>
      <mirrorOf>burtsev-net-maven</mirrorOf>
      <url>http://maven.burtsev.net</url>
      <blocked>false</blocked>
    </mirror>
    <mirror>
      <id>oracle-http</id>
      <mirrorOf>oracleReleases</mirrorOf>
      <url>http://download.oracle.com/maven</url>
      <blocked>false</blocked>
    </mirror>
    <mirror>
      <id>reflections-http</id>
      <mirrorOf>reflections-repo</mirrorOf>
      <url>http://reflections.googlecode.com/svn/repo</url>
      <blocked>false</blocked>
    </mirror>
  </mirrors>

</settings>
        EOL

    - name: Build, test, and collect coverage with JaCoCo
      run: mvn -B clean org.jacoco:jacoco-maven-plugin:prepare-agent install sonar:sonar -Dsonar.projectKey=giuseppeamato_lsc-scim-plugin -Dsonar.organization=giuseppeamato -Dsonar.login=${{ secrets.SONAR_TOKEN }}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: target/site/jacoco/jacoco.xml